# Put the Zig installation directory on PATH before invoking Meson.
# build-deps32 supplies locally extracted lib32 Xi, Xtst, and xkbcommon.
[constants]
repo = '@GLOBAL_SOURCE_ROOT@'

[binaries]
c = ['zig', 'cc', '-target', 'x86-linux-gnu.2.34']
cpp = ['zig', 'c++', '-target', 'x86-linux-gnu.2.34']
ar = ['zig', 'ar']
strip = 'strip'
pkg-config = ['pkg-config', '--define-prefix']

[host_machine]
system = 'linux'
cpu_family = 'x86'
cpu = 'i686'
endian = 'little'

[properties]
needs_exe_wrapper = false
pkg_config_libdir = [repo / 'build-deps32/usr/lib32/pkgconfig', '/usr/lib32/pkgconfig', '/usr/share/pkgconfig', repo / 'build/deps/wayland-protocols/usr/share/pkgconfig']

[built-in options]
c_args = ['-idirafter', '/usr/include']
cpp_args = ['-idirafter', '/usr/include']
c_link_args = ['-Wl,-rpath,$ORIGIN/runtime-libs']
cpp_link_args = ['-Wl,-rpath,$ORIGIN/runtime-libs']
