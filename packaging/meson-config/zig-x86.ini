# Portable i686 cross file: only what is true on any machine with Zig installed.
# Where this machine keeps its 32-bit .pc files, headers and private runtime
# libraries is machine-specific and lives in a generated second cross file;
# scripts/build-i686.sh writes it and passes both. See docs/WORKFLOWS.md.
[binaries]
c = ['zig', 'cc', '-target', 'x86-linux-gnu.2.34']
cpp = ['zig', 'c++', '-target', 'x86-linux-gnu.2.34']
ar = ['zig', 'ar']
strip = 'strip'
pkg-config = ['pkg-config', '--define-prefix']

[host_machine]
system = 'linux'
cpu_family = 'x86'
cpu = 'i686'
endian = 'little'

[properties]
needs_exe_wrapper = false
